# Retro Neon Tmux

# set -g status-style "bg=#000000,fg=#e6e2d8"
setw -g window-status-style "fg=#a5968b"
setw -g window-status-current-style "fg=#8fb2ff"
set -g pane-border-style "fg=#1e1e1e"
set -g pane-active-border-style "fg=#8fb2ff"
set -g message-style "fg=#e6e2d8"
set -g message-command-style "fg=#e6e2d8"
set -g status-left " #S "
set -g status-right ""
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
